name: Update the Journal Research Desk

# Once a day, reads every post from all eight blogs, rebuilds the post list in
# desk/index.html, and commits only when a post was added, edited or removed.
# GitHub Pages republishes the desk after each commit:
# https://kislingjeff-oss.github.io/JAKPublicBlogDatabase/desk/

on:
  schedule:
    - cron: "41 10 * * *"   # every day at 10:41 UTC (5:41 am Central)
  workflow_dispatch:         # "Run workflow" button on the Actions tab
  push:
    branches: [main]
    paths:
      - "desk/template.html"
      - "scripts/update_desk.py"
      - ".github/workflows/update-desk.yml"

permissions:
  contents: write

concurrency:
  group: update-desk
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install beautifulsoup4 markdownify pyyaml

      - name: Rebuild the desk from all eight blogs
        run: python3 scripts/update_desk.py

      - name: Check OKF v0.2 conformance
        run: python3 scripts/okf_validate.py

      - name: Commit changes, if any
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No new or changed posts."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desk/index.html
          git commit -m "Update the research desk with new and changed posts"
          git pull --rebase origin main
          git push
